server {
    listen 80;
    server_name _;

    root /var/www/smart-factory;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Serve static assets with long cache (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Always revalidate the shell so a browser picks up the latest hashed app
    # entry after a deployment.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }

    # The widget entry document must always be revalidated so a deployment
    # cannot leave an already-used iframe on an older live-data implementation.
    location = /widgets/gw-twin/app/index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }

    # Live data WebSocket → cloud-bridge (subscribes IoT Core, fans out here).
    # The frontend connects to wss://<host>/ws when VITE_MQTT_BRIDGE_URL points
    # at this path. Long read timeout keeps idle MQTT connections alive.
    location /ws {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Read-only AWS IoT DeviceInfo stream for the embedded GW Operational Twin.
    # This is intentionally separate from /ws so existing Smart Factory MQTT
    # payloads and subscriptions remain unchanged.
    location = /api/gateway-logs/stream {
        proxy_pass http://127.0.0.1:46121/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location = /api/gateway-logs/readyz {
        proxy_pass http://127.0.0.1:46121/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache off;
    }

    # Browser-facing LangGraph path -> the reverse SSH tunnel from the plant.
    # The trailing slash strips /langgraph/ so LangGraph receives /api/prompt
    # and /api/response/:id without exposing port 8765 publicly.
    location /langgraph/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Smart Factory integration API → Express/AWS IoT subscriber. This must
    # appear before the SPA fallback; otherwise /api/ipsec/* returns index.html
    # and EventSource retries forever. Buffering and gzip stay off so SSE events
    # reach the dashboard as soon as the gateway publishes them.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;
}
